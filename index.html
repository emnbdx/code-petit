<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tiny Logic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="home-container">
      <div class="home-logo" aria-hidden="true">
        <svg class="logo-bird" viewBox="0 0 48 48" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="24" cy="26" rx="14" ry="13" fill="#FFD966" stroke="#E6B800" stroke-width="1.5"/>
          <ellipse cx="24" cy="30" rx="9" ry="8" fill="#FFF3BF"/>
          <ellipse cx="13" cy="24" rx="5" ry="8" fill="#F0C030" transform="rotate(-15 13 24)"/>
          <ellipse cx="35" cy="24" rx="5" ry="8" fill="#F0C030" transform="rotate(15 35 24)"/>
          <circle cx="19" cy="18" r="4.5" fill="white" stroke="#333" stroke-width="0.8"/>
          <circle cx="20" cy="17.5" r="2.2" fill="#333"/>
          <circle cx="20.8" cy="16.8" r="0.8" fill="white"/>
          <circle cx="29" cy="18" r="4.5" fill="white" stroke="#333" stroke-width="0.8"/>
          <circle cx="30" cy="17.5" r="2.2" fill="#333"/>
          <circle cx="30.8" cy="16.8" r="0.8" fill="white"/>
          <polygon points="24,4 20,14 28,14" fill="#FF6B35" stroke="#E05020" stroke-width="1" stroke-linejoin="round"/>
          <ellipse cx="22" cy="11" rx="2" ry="4" fill="#FF6B35" transform="rotate(-20 22 11)"/>
          <ellipse cx="26" cy="10" rx="2" ry="5" fill="#FF8C42" transform="rotate(10 26 10)"/>
          <line x1="20" y1="38" x2="18" y2="44" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
          <line x1="28" y1="38" x2="30" y2="44" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
          <line x1="18" y1="44" x2="15" y2="44" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
          <line x1="30" y1="44" x2="33" y2="44" stroke="#FF6B35" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="home-title" data-i18n="app_name">Tiny Logic</h1>
      <p class="home-subtitle" data-i18n="home_subtitle">Learn logic by playing!</p>

      <!-- Language switcher -->
      <div class="lang-switcher" id="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>

      <button class="btn btn-play" id="btn-start">
        <span class="btn-icon">&#9654;</span> <span data-i18n="btn_play">Play</span>
      </button>
      <button class="btn btn-secondary" id="btn-continue" style="display:none;" data-i18n="btn_continue">
        Continue
      </button>
      <button class="btn btn-hero-change" id="btn-hero-change" style="display:none;" data-i18n="btn_change_hero">
        Change hero
      </button>
      <button class="btn btn-reset-progress" id="btn-reset-progress" style="display:none;" data-i18n="btn_reset_progress">
        Reset progress
      </button>
    </div>

  <!-- RESET CONFIRM MODAL -->
  <div id="modal-reset" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="fail-icon">&#9888;</div>
      <h2 class="fail-title" style="color:var(--text);" data-i18n="reset_title">Reset everything?</h2>
      <p class="fail-msg" data-i18n="reset_msg">All your progress will be lost. Sure?</p>
      <div class="victory-buttons">
        <button class="btn btn-secondary" id="btn-reset-cancel" data-i18n="btn_no">No</button>
        <button class="btn btn-play" id="btn-reset-confirm" style="background:#e53e3e;box-shadow:0 4px 0 #c53030;" data-i18n="btn_yes">Yes</button>
      </div>
    </div>
  </div>
  </div>

  <!-- HERO SELECT SCREEN -->
  <div id="screen-hero" class="screen">
    <div class="hero-select-container">
      <h2 class="hero-select-title" data-i18n="hero_select_title">Choose your hero!</h2>
      <p class="hero-select-sub" data-i18n="hero_select_sub">Who will join you on the adventure?</p>

      <div class="hero-cards" id="hero-cards">
        <!-- Filled by JS -->
      </div>

      <div class="hero-colors-section" id="hero-colors-section">
        <p class="hero-colors-label" data-i18n="hero_colors_label">Customize colors:</p>
        <div class="hero-color-swatches" id="hero-color-swatches">
          <!-- Filled by JS -->
        </div>
      </div>

      <button class="btn btn-play hero-confirm-btn" id="btn-hero-confirm" data-i18n="btn_hero_confirm">
        Let's go!
      </button>
    </div>
  </div>

  <!-- WORLD SELECT SCREEN -->
  <div id="screen-worlds" class="screen">
    <div class="screen-header">
      <button class="btn-back" id="btn-worlds-back" aria-label="Back">&#9664;</button>
      <h2 class="screen-title" data-i18n="worlds_title">Worlds</h2>
      <div class="spacer"></div>
    </div>
    <div class="worlds-grid" id="worlds-grid">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- LEVEL SELECT SCREEN -->
  <div id="screen-levels" class="screen">
    <div class="screen-header">
      <button class="btn-back" id="btn-levels-back" aria-label="Back">&#9664;</button>
      <h2 class="screen-title" id="levels-title">World 1</h2>
      <div class="spacer"></div>
    </div>
    <div class="levels-grid" id="levels-grid">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <button class="btn-back" id="btn-game-back" aria-label="Back">&#9664;</button>
      <div class="game-level-info">
        <span id="game-world-name"></span>
        <span id="game-level-num"></span>
      </div>
      <div class="game-stars-display" id="game-stars-display"></div>
    </div>

    <div class="game-area" id="game-area">
      <div class="grid-container" id="grid-container">
        <!-- Grid cells generated by JS -->
      </div>
      <div class="hero" id="hero"></div>
    </div>

    <div class="game-hint" id="game-hint" style="display:none;"></div>

    <div class="program-area" id="program-area">
      <div class="program-label" data-i18n="program_label">My program:</div>
      <div class="program-slots" id="program-slots">
        <div class="program-empty" data-i18n="program_empty">Add instructions!</div>
      </div>
    </div>

    <div class="function-area" id="function-area" style="display:none;">
      <div class="function-tabs">
        <button class="func-tab active" data-func="main" id="tab-main" data-i18n="tab_main">Main</button>
        <button class="func-tab" data-func="f1" id="tab-f1">F1</button>
        <button class="func-tab" data-func="f2" id="tab-f2" style="display:none;">F2</button>
      </div>
    </div>

    <div class="loop-config" id="loop-config" style="display:none;">
      <div class="loop-config-inner">
        <span class="loop-label" data-i18n="loop_label">How many times?</span>
        <div class="loop-buttons">
          <button class="loop-btn" data-count="2">2</button>
          <button class="loop-btn" data-count="3">3</button>
          <button class="loop-btn" data-count="4">4</button>
          <button class="loop-btn" data-count="5">5</button>
          <button class="loop-btn" data-count="6">6</button>
        </div>
        <button class="btn btn-small" id="loop-cancel" data-i18n="btn_cancel">Cancel</button>
      </div>
    </div>

    <div class="palette" id="palette">
      <!-- Instruction buttons generated by JS -->
    </div>

    <div class="controls">
      <button class="btn btn-control btn-run" id="btn-run" aria-label="Run">
        <span class="control-icon">&#9654;</span>
      </button>
      <button class="btn btn-control btn-stop" id="btn-stop" aria-label="Stop" style="display:none;">
        <span class="control-icon">&#9632;</span>
      </button>
      <button class="btn btn-control btn-reset" id="btn-reset" aria-label="Reset">
        <span class="control-icon">&#8634;</span>
      </button>
      <button class="btn btn-control btn-clear" id="btn-clear" aria-label="Clear">
        <span class="control-icon">&#10005;</span>
      </button>
      <button class="btn btn-control btn-speed" id="btn-speed" aria-label="Speed">
        <span class="control-icon" id="speed-icon">1x</span>
      </button>
    </div>
  </div>

  <!-- VICTORY MODAL -->
  <div id="modal-victory" class="modal" style="display:none;">
    <div class="modal-content victory-content">
      <div class="victory-stars" id="victory-stars"></div>
      <h2 class="victory-title" id="victory-title">Great!</h2>
      <p class="victory-msg" id="victory-msg"></p>
      <div class="victory-buttons">
        <button class="btn btn-secondary" id="btn-replay" data-i18n="btn_replay">Replay</button>
        <button class="btn btn-play" id="btn-next" data-i18n="btn_next">Next &#9654;</button>
      </div>
    </div>
  </div>

  <!-- FAIL MODAL -->
  <div id="modal-fail" class="modal" style="display:none;">
    <div class="modal-content fail-content">
      <div class="fail-icon">&#128533;</div>
      <h2 class="fail-title" id="fail-title" data-i18n="fail_title">Oops!</h2>
      <p class="fail-msg" id="fail-msg" data-i18n="fail_msg_default">Your hero didn't reach the treasure.</p>
      <div class="victory-buttons">
        <button class="btn btn-play" id="btn-retry" data-i18n="btn_retry">Retry</button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
