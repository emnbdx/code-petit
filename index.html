<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CodePetit - Apprends la logique en jouant !</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="home-container">
      <div class="home-logo">
        <div class="logo-robot" aria-hidden="true">
          <div class="robot-head">
            <div class="robot-eye left"></div>
            <div class="robot-eye right"></div>
            <div class="robot-mouth"></div>
          </div>
          <div class="robot-body"></div>
        </div>
      </div>
      <h1 class="home-title">CodePetit</h1>
      <p class="home-subtitle">Apprends la logique en jouant !</p>
      <button class="btn btn-play" id="btn-start">
        <span class="btn-icon">&#9654;</span> Jouer
      </button>
      <button class="btn btn-secondary" id="btn-continue" style="display:none;">
        Continuer
      </button>
    </div>
  </div>

  <!-- WORLD SELECT SCREEN -->
  <div id="screen-worlds" class="screen">
    <div class="screen-header">
      <button class="btn-back" id="btn-worlds-back" aria-label="Retour">&#9664;</button>
      <h2 class="screen-title">Les Mondes</h2>
      <div class="spacer"></div>
    </div>
    <div class="worlds-grid" id="worlds-grid">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- LEVEL SELECT SCREEN -->
  <div id="screen-levels" class="screen">
    <div class="screen-header">
      <button class="btn-back" id="btn-levels-back" aria-label="Retour">&#9664;</button>
      <h2 class="screen-title" id="levels-title">Monde 1</h2>
      <div class="spacer"></div>
    </div>
    <div class="levels-grid" id="levels-grid">
      <!-- Filled by JS -->
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <button class="btn-back" id="btn-game-back" aria-label="Retour">&#9664;</button>
      <div class="game-level-info">
        <span id="game-world-name"></span>
        <span id="game-level-num"></span>
      </div>
      <div class="game-stars-display" id="game-stars-display"></div>
    </div>

    <div class="game-area" id="game-area">
      <div class="grid-container" id="grid-container">
        <!-- Grid cells generated by JS -->
      </div>
      <div class="hero" id="hero">
        <div class="hero-inner">
          <div class="hero-eye left"></div>
          <div class="hero-eye right"></div>
          <div class="hero-arrow"></div>
        </div>
      </div>
    </div>

    <div class="game-hint" id="game-hint" style="display:none;"></div>

    <div class="program-area" id="program-area">
      <div class="program-label">Mon programme :</div>
      <div class="program-slots" id="program-slots">
        <div class="program-empty">Ajoute des instructions !</div>
      </div>
    </div>

    <div class="function-area" id="function-area" style="display:none;">
      <div class="function-tabs">
        <button class="func-tab active" data-func="main" id="tab-main">Principal</button>
        <button class="func-tab" data-func="f1" id="tab-f1">F1</button>
        <button class="func-tab" data-func="f2" id="tab-f2" style="display:none;">F2</button>
      </div>
    </div>

    <div class="loop-config" id="loop-config" style="display:none;">
      <div class="loop-config-inner">
        <span class="loop-label">Combien de fois ?</span>
        <div class="loop-buttons">
          <button class="loop-btn" data-count="2">2</button>
          <button class="loop-btn" data-count="3">3</button>
          <button class="loop-btn" data-count="4">4</button>
          <button class="loop-btn" data-count="5">5</button>
          <button class="loop-btn" data-count="6">6</button>
        </div>
        <button class="btn btn-small" id="loop-cancel">Annuler</button>
      </div>
    </div>

    <div class="palette" id="palette">
      <!-- Instruction buttons generated by JS -->
    </div>

    <div class="controls">
      <button class="btn btn-control btn-run" id="btn-run" aria-label="Jouer">
        <span class="control-icon">&#9654;</span>
      </button>
      <button class="btn btn-control btn-stop" id="btn-stop" aria-label="Stop" style="display:none;">
        <span class="control-icon">&#9632;</span>
      </button>
      <button class="btn btn-control btn-reset" id="btn-reset" aria-label="Recommencer">
        <span class="control-icon">&#8634;</span>
      </button>
      <button class="btn btn-control btn-clear" id="btn-clear" aria-label="Tout effacer">
        <span class="control-icon">&#10005;</span>
      </button>
      <button class="btn btn-control btn-speed" id="btn-speed" aria-label="Vitesse">
        <span class="control-icon" id="speed-icon">1x</span>
      </button>
    </div>
  </div>

  <!-- VICTORY MODAL -->
  <div id="modal-victory" class="modal" style="display:none;">
    <div class="modal-content victory-content">
      <div class="victory-stars" id="victory-stars"></div>
      <h2 class="victory-title" id="victory-title">Bravo !</h2>
      <p class="victory-msg" id="victory-msg"></p>
      <div class="victory-buttons">
        <button class="btn btn-secondary" id="btn-replay">Rejouer</button>
        <button class="btn btn-play" id="btn-next">Suivant &#9654;</button>
      </div>
    </div>
  </div>

  <!-- FAIL MODAL -->
  <div id="modal-fail" class="modal" style="display:none;">
    <div class="modal-content fail-content">
      <div class="fail-icon">&#128533;</div>
      <h2 class="fail-title" id="fail-title">Oups !</h2>
      <p class="fail-msg" id="fail-msg">Le robot n'a pas atteint l'objectif. Essaie encore !</p>
      <div class="victory-buttons">
        <button class="btn btn-play" id="btn-retry">Recommencer</button>
      </div>
    </div>
  </div>

  <script src="js/sounds.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
